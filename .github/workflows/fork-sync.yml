name: Fork sync

# Daily rebase of the fork branch `personal` onto upstream main, with one version
# commit on top. Procedure and branch layout: scripts/fork/README.md.
#
# Token separation: `sync` runs upstream code (the rebased tree's tests) with a
# read-only token and no secret. `push` alone holds the push token and only pushes the
# bundle `sync` produced. `report` files every blockage in one issue labeled
# fork-sync with GITHUB_TOKEN. Neither `push` nor `report` checks out or runs
# repository code.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      result: ${{ steps.outcome.outputs.result }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Rebase, version and test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/fork/sync.sh "$RUNNER_TEMP/outcome"

      - name: Read the outcome
        id: outcome
        run: |
          result=$(cat "$RUNNER_TEMP/outcome/result")
          case "$result" in push|noop|blocked) ;; *) echo "::error::unknown sync result: $result"; exit 1 ;; esac
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Hand the outcome to the next jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-sync-outcome
          path: ${{ runner.temp }}/outcome
          retention-days: 1
          if-no-files-found: error

  push:
    needs: sync
    if: needs.sync.outputs.result == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Fetch the outcome
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fork-sync-outcome
          path: ${{ runner.temp }}/outcome

      # The lease is the personal sha the sync job started from: if personal moved
      # since, the push is rejected and nothing is overwritten.
      - name: Push with lease
        id: push
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          PUSH_URL: https://github.com/${{ github.repository }}.git
        run: |
          expected=$(cat "$RUNNER_TEMP/outcome/expected")
          repo="$RUNNER_TEMP/push.git"
          git init -q --bare "$repo"
          git -C "$repo" fetch -q "$RUNNER_TEMP/outcome/sync.bundle" "refs/heads/personal:refs/heads/personal"
          git -C "$repo" -c credential.helper= \
            -c credential.helper='!f() { echo username=x-access-token; echo "password=$FORK_SYNC_TOKEN"; }; f' \
            push --force-with-lease="personal:$expected" "$PUSH_URL" "refs/heads/personal:refs/heads/personal"

  report:
    needs: [sync, push]
    if: always() && needs.sync.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Fetch the outcome
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fork-sync-outcome
          path: ${{ runner.temp }}/outcome

      # report.md came from a job that ran upstream code; it is only quoted, never executed.
      - name: Open, update or close the fork-sync issue
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSH_RESULT: ${{ needs.push.result }}
        run: |
          out="$RUNNER_TEMP/outcome"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          result=$(cat "$out/result")
          if [ "$result" = push ] && [ "$PUSH_RESULT" != success ]; then
            result=blocked
            {
              echo "## Fork sync blocked: push rejected"
              echo
              echo "The rebase, version commit and checks were clean, but the push to \`personal\` failed ($PUSH_RESULT)."
              echo "Either \`personal\` moved during the run (the lease on \`$(cat "$out/expected")\` rejected it and nothing was overwritten), or the push token secret is missing or lacks contents and workflows write access."
              echo
              echo "Check the push job log; after fixing the token, or once \`personal\` is settled, start the workflow again: \`gh workflow run fork-sync.yml -R $GITHUB_REPOSITORY\`."
              echo "Procedure: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/personal/scripts/fork/README.md"
            } > "$out/report.md"
          fi
          issue=$(gh issue list --label fork-sync --state open --json number --jq '.[0].number // empty')
          if [ "$result" = blocked ]; then
            printf '\nRun: %s\n' "$run_url" >> "$out/report.md"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body-file "$out/report.md"
            else
              gh label create fork-sync --color B60205 --description "Daily fork sync is blocked" 2>/dev/null || true
              gh issue create --title "Fork sync blocked" --label fork-sync --body-file "$out/report.md"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Fork sync ran clean ($result): $run_url"
          fi
